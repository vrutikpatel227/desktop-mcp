services:
  postgres:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: desktop_mcp
      POSTGRES_USER: desktop_mcp
      POSTGRES_PASSWORD: change-me-in-production
    volumes:
      - pgdata:/var/lib/postgresql/data

  redis:
    image: redis:8-alpine
    restart: unless-stopped
    command: ["redis-server", "--appendonly", "yes"]
    volumes:
      - redisdata:/data

  gateway:
    build:
      context: ..
      dockerfile: Dockerfile.gateway
    restart: unless-stopped
    depends_on: [postgres, redis]
    environment:
      NODE_ENV: production
      DESKTOP_MCP_GATEWAY_PORT: 8790
      DESKTOP_MCP_DATABASE_URL: postgresql://desktop_mcp:change-me-in-production@postgres:5432/desktop_mcp
      REDIS_URL: redis://redis:6379
      DESKTOP_MCP_ADMIN_TOKEN: replace-with-a-secret
      DESKTOP_MCP_ISSUER: https://mcp.example.com
      DESKTOP_MCP_TRUST_PROXY_TLS: "true"
    ports:
      - "8790:8790"

  dashboard:
    build:
      context: ..
      dockerfile: Dockerfile.dashboard
    restart: unless-stopped
    depends_on: [gateway]
    environment:
      NODE_ENV: production
      DESKTOP_MCP_GATEWAY_URL: http://gateway:8790
      DESKTOP_MCP_ADMIN_TOKEN: replace-with-a-secret
      DASHBOARD_AUTH_USER: replace-with-admin-user
      DASHBOARD_AUTH_PASSWORD: replace-with-a-long-random-password
    ports:
      - "3000:3000"

  caddy:
    image: caddy:2-alpine
    restart: unless-stopped
    depends_on: [gateway, dashboard]
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config

volumes:
  pgdata:
  redisdata:
  caddy_data:
  caddy_config:
